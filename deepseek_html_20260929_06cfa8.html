<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С днём рождения, Таня!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #1a1e2b 0%, #252b3d 100%);
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: absolute;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      background: #f9a8d4;
      top: -20vmax;
      left: -20vmax;
    }

    body::after {
      background: #93c5fd;
      bottom: -20vmax;
      right: -20vmax;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 3rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      transition: transform 0.3s ease;
      animation: float 7s ease-in-out infinite;
    }

    .card:hover {
      transform: scale(1.005);
    }

    h1 {
      font-weight: 700;
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #fbc2eb 0%, #a6c1ee 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.4rem;
      line-height: 1.2;
      text-shadow: 0 2px 20px rgba(251, 194, 235, 0.3);
    }

    .subhead {
      font-size: 1.2rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 2rem;
      letter-spacing: 0.3px;
    }

    .timer-label {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 0.8rem;
    }

    .timer {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .timer-block {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 1.8rem;
      padding: 0.8rem 0.2rem;
      min-width: 90px;
      flex: 1 0 80px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
    }

    .timer-number {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
    }

    .timer-text {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }

    .message {
      font-size: 1.1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
      margin: 1.8rem 0 2.5rem;
      font-weight: 400;
      padding: 0 0.5rem;
    }

    .message strong {
      color: #fbc2eb;
      font-weight: 600;
    }

    .video-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      border: none;
      border-radius: 4rem;
      padding: 1.2rem 2.8rem;
      font-size: 1.2rem;
      font-weight: 600;
      color: #1a1e2b;
      text-decoration: none;
      letter-spacing: 0.3px;
      box-shadow: 0 18px 30px -10px rgba(166, 193, 238, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      cursor: pointer;
      margin-bottom: 0.5rem;
      width: 100%;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }

    .video-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 35px -8px #a6c1ee, 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
      background: linear-gradient(135deg, #fdd0f2, #b8d0ff);
    }

    .video-btn:active {
      transform: translateY(0);
      box-shadow: 0 10px 20px -5px #a6c1ee;
    }

    .video-icon {
      font-size: 1.6rem;
      line-height: 1;
    }

    .note {
      margin-top: 1.8rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 0.5px;
    }

    .celebrate {
      display: none;
      font-size: clamp(2rem, 9vw, 3.6rem);
      font-weight: 700;
      line-height: 1.15;
      background: linear-gradient(120deg, #fbc2eb 0%, #a6c1ee 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
      text-shadow: 0 2px 30px rgba(251, 194, 235, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.5rem;
        border-radius: 2.5rem;
      }

      .timer-block {
        min-width: 65px;
        padding: 0.6rem 0.1rem;
      }

      .timer-number {
        font-size: 1.8rem;
      }

      .timer-text {
        font-size: 0.65rem;
      }

      .video-btn {
        padding: 1rem 1.5rem;
        font-size: 1rem;
        gap: 0.5rem;
      }

      .message {
        font-size: 1rem;
      }
    }

    @media (max-width: 360px) {
      .timer {
        gap: 0.4rem;
      }
      .timer-block {
        min-width: 55px;
      }
      .timer-number {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="normalHeader">
      <h1>Скоро день рождения<br>Тани!</h1>
      <div class="subhead">✨ осталось совсем чуть-чуть ✨</div>
    </div>

    <div id="birthdayHeader" style="display: none;">
      <div class="celebrate">С днём рождения,<br>Таня! 🎉</div>
      <div class="subhead">✨ пусть этот день будет волшебным ✨</div>
    </div>

    <div id="timerSection">
      <div class="timer-label">До дня рождения осталось</div>
      <div class="timer" id="timer">
        <div class="timer-block">
          <div class="timer-number" id="days">00</div>
          <div class="timer-text">дней</div>
        </div>
        <div class="timer-block">
          <div class="timer-number" id="hours">00</div>
          <div class="timer-text">часов</div>
        </div>
        <div class="timer-block">
          <div class="timer-number" id="minutes">00</div>
          <div class="timer-text">минут</div>
        </div>
        <div class="timer-block">
          <div class="timer-number" id="seconds">00</div>
          <div class="timer-text">секунд</div>
        </div>
      </div>
    </div>

    <div class="message" id="messageBlock">
      <strong>Таня</strong>, я приготовил для тебя подарок — нажми на кнопку ниже.
    </div>

    <a href="#" class="video-btn" id="videoLink" target="_blank" rel="noopener noreferrer">
      <span class="video-icon">🎬</span>
      Смотреть видео-подарок
    </a>

    <div class="note">с любовью, для тебя ❤️</div>
  </div>

  <script>
    (function() {
      // === ВАША ССЫЛКА НА ВИДЕО С GOOGLE ДИСКА ===
      const VIDEO_URL = "https://drive.google.com/file/d/12QMJ1BoNhPv1_tLnzlkBBISM8ObjfzgF/view?usp=drive_link";

      const videoLink = document.getElementById('videoLink');
      if (videoLink) {
        videoLink.href = VIDEO_URL;
      }

      // === ДЕНЬ РОЖДЕНИЯ: 30 СЕНТЯБРЯ ===
      const BIRTHDAY_MONTH = 8; // сентябрь = 8 (месяцы с 0)
      const BIRTHDAY_DAY = 30;

      function getBirthdayDate(year) {
        return new Date(year, BIRTHDAY_MONTH, BIRTHDAY_DAY, 0, 0, 0, 0);
      }

      function getNextBirthday() {
        const now = new Date();
        const thisYear = getBirthdayDate(now.getFullYear());
        if (now < thisYear) {
          return thisYear;
        }
        return getBirthdayDate(now.getFullYear() + 1);
      }

      function isBirthdayToday() {
        const now = new Date();
        return now.getMonth() === BIRTHDAY_MONTH && now.getDate() === BIRTHDAY_DAY;
      }

      const timerSection = document.getElementById('timerSection');
      const normalHeader = document.getElementById('normalHeader');
      const birthdayHeader = document.getElementById('birthdayHeader');
      const messageBlock = document.getElementById('messageBlock');

      function showBirthdayMode() {
        timerSection.style.display = 'none';
        normalHeader.style.display = 'none';
        birthdayHeader.style.display = 'block';
        messageBlock.innerHTML = '<strong>Таня, с праздником!</strong> Этот день — твой. Нажми на кнопку, там сюрприз 🎁';
      }

      let birthdayShown = false;

      function updateTimer() {
        if (isBirthdayToday()) {
          if (!birthdayShown) {
            showBirthdayMode();
            birthdayShown = true;
          }
          return;
        }

        const target = getNextBirthday();
        const now = new Date();
        let diffMs = target - now;
        if (diffMs < 0) diffMs = 0;

        const totalSeconds = Math.floor(diffMs / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        const pad = (n) => String(n).padStart(2, '0');

        document.getElementById('days').textContent = pad(days);
        document.getElementById('hours').textContent = pad(hours);
        document.getElementById('minutes').textContent = pad(minutes);
        document.getElementById('seconds').textContent = pad(seconds);
      }

      updateTimer();
      setInterval(updateTimer, 1000);
    })();
  </script>
</body>
</html>
